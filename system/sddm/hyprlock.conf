; Config generee pour reproduire l'ecran de verrouillage hyprlock.
; Couleurs issues de matugen (~/.config/hypr/colors.conf).

[General]
scale = 1.0
enable-animations = true
background-fill-mode = "fill"

[LockScreen]
display = true
background = "wallpaper.png"
use-background-color = false
blur = 12
brightness = -0.08
saturation = 0.25

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "HH<br>mm"
font-family = "Adwaita Sans"
font-size = 96
font-weight = 800
color = "#f8dfbb"

[LockScreen.Date]
display = true
format = "dddd dd MMM"
locale = "fr_FR"
font-family = "JetBrainsMono Nerd Font"
font-size = 16
font-weight = 700
color = "#dac3a1"
margin-top = 10

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Appuie sur une touche"
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#dac3a1"
paint-icon = true

[LoginScreen]
background = "wallpaper.png"
use-background-color = false
blur = 12
brightness = -0.08
saturation = 0.25

[LoginScreen.LoginArea]
position = "center"
; -1 est la valeur qui centre verticalement ; toute autre
; valeur ancre la zone en haut avec cette marge
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
active-size = 110
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 0
inactive-border-size = 0

[LoginScreen.LoginArea.Username]
font-family = "JetBrainsMono Nerd Font"
font-size = 16
font-weight = 700
color = "#ece1d4"
margin = 12

[LoginScreen.LoginArea.PasswordInput]
width = 250
height = 50
display-icon = true
font-family = "JetBrainsMono Nerd Font"
font-size = 13
icon = "password.svg"
icon-size = 16
content-color = "#dac3a1"
background-color = "#FFFFFF"
background-opacity = 0.10
border-size = 3
border-color = "#f6b73c"
border-radius-left = 22
border-radius-right = 22
margin-top = 14
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#f6b73c"
background-opacity = 0.20
active-background-color = "#f6b73c"
active-background-opacity = 0.40
icon = "arrow-right.svg"
icon-size = 18
content-color = "#f8dfbb"
active-content-color = "#f8dfbb"
border-size = 0
border-radius-left = 22
border-radius-right = 22
margin-left = 6
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 600
