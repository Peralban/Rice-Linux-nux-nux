[Settings]
# On this desktop GTK3 takes its settings from GSettings, not from this file:
# gtk-theme-name here was measured to have no effect while the GSettings key
# did. It is kept for XWayland clients and anything that reads it directly,
# and must agree with what the README tells you to set through gsettings.
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Adwaita
gtk-font-name=Adwaita Sans 11
gtk-cursor-theme-name=default
gtk-application-prefer-dark-theme=1
