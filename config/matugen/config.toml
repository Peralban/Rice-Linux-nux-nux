[config.wallpaper]
command = "awww img {{ image }} --transition-type any --transition-fps 60"
set = true

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
# SIGUSR2 makes a live bar re-read its stylesheet. If there is no bar to
# signal, pkill just fails and the palette changes with nothing wearing it --
# so start one instead. `setsid -f` detaches it, or it would die with matugen.
post_hook = 'pkill -SIGUSR2 -x waybar || setsid -f waybar >/dev/null 2>&1'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = "kill -SIGUSR1 $(pidof kitty)"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.gtk3]
# GTK3 themes do not read libadwaita's colour names, so the gtk4 template was
# inert here: its own template emits @theme_bg_color and the rest of the set
# Adwaita 3.24 actually consumes.
input_path = '~/.config/matugen/templates/gtk3-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = '~/.config/hypr/scripts/gtk3-reload.sh'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = 'pkill -SIGUSR1 -f "Hypr(Whale|Notes|Duo)[.]py" || true'

[templates.btop]
# btop reads neither GTK nor the terminal palette: it loads a named .theme
# file. No post hook -- it is a TUI, restarted far more often than the
# wallpaper changes.
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.zathura]
# zathura styles itself through its own settings, not GTK CSS, so being a GTK4
# client buys it nothing. No post hook: each invocation is a fresh process and
# reads the file at startup.
input_path = '~/.config/matugen/templates/zathura-colors'
output_path = '~/.config/zathura/colors.rc'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.cava]
input_path = '~/.config/matugen/templates/matugen-cava'
output_path = '~/.config/cava/config'
# cava only runs while its waybar module is on screen; not signalling a
# process that is not there is not a failure.
post_hook = "pkill -USR1 -x cava || true"

[templates.spicetify]
# Spicetify patches Spotify's own asset bundle, so a regenerated color.ini
# means nothing until it is re-applied. Unlike a stylesheet, nothing re-reads
# this file on its own.
input_path = '~/.config/matugen/templates/spotify-colors.ini'
output_path = '~/.config/spicetify/Themes/text/color.ini'
post_hook = 'spicetify apply -n >/dev/null 2>&1 || true'

[templates.vesktop]
input_path = '~/.config/matugen/templates/midnight-discord.css'
output_path = '~/.config/vesktop/themes/matugen.css'

[templates.zed]
# Zed draws its own interface with GPUI, so it reads no GTK stylesheet at all.
# What it does read is this: a theme file, watched live, so no post hook. The
# file carries both appearances, and Zed picks one from the system setting.
input_path = '~/.config/matugen/templates/zed-theme.json'
output_path = '~/.config/zed/themes/matugen.json'

[templates.vicinae]
input_path = '~/.config/matugen/templates/vicinae.toml'
output_path = '~/.local/share/vicinae/themes/matugen.toml'
post_hook = 'vicinae theme set matugen || true'
