# Vicinae theme -- generated by matugen from the wallpaper.
# Do not edit: regenerated on every wallpaper change.

[meta]
name = "Matugen"
description = "Palette extraite du fond d'écran courant"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
accent = "{{colors.primary.default.hex}}"
accent_foreground = "{{colors.on_primary.default.hex}}"
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
secondary_background = "{{colors.surface_container.default.hex}}"
border = "{{colors.outline_variant.default.hex}}"

[colors.main_window]
border = "{{colors.outline_variant.default.hex}}"
footer = { background = "colors.core.secondary_background" }

[colors.settings_window]
border = "{{colors.outline_variant.default.hex}}"
