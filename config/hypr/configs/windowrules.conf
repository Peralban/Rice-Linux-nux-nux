# APPLICATIONS BLUR
windowrule = no_blur true, match:tag multimedia_video*
windowrule = opacity 1.0, match:tag multimedia_video*
windowrule = opacity 0.8, match:tag settings*
windowrule = opacity 0.8, match:class ^(org.gnome.Nautilus)$
windowrule = opacity 0.9, match:class ^(gedit|org.gnome.TextEditor|mousepad)$
windowrule = opacity 0.9, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.9, match:class ^(kitty)$
windowrule = opacity 0.85 override 0.7 override 1 override, match:class ^(discord|vesktop|org.telegram.desktop)$
windowrule = opacity 0.8 override 0.6 override 1 override, match:class ^(Spotify)$
windowrule = opacity 0.9 override 0.7 override 1 override, match:class ^(zen)$
#windowrule = opacity 0.8 override 0.6 override 1 override, match:tag viewer*

# LAYER RULES
#layerrule = blur true, match:namespace rofi
#layerrule = dim_around true, match:namespace rofi
#layerrule = animation popin 10%, match:namespace rofi
#layerrule = blur true, match:namespace notifications
layerrule = blur true, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar
layerrule = ignore_alpha 0.5, match:tag notif*
layerrule = blur true, match:namespace logout_dialog

# HYPRNOTCH
# ignore_alpha above the ghost value (1%): at rest the shell is not blurred,
# so nothing gives its presence in the bar away.
layerrule = blur true, match:namespace hyprnotch
layerrule = ignore_alpha 0.2, match:namespace hyprnotch
layerrule = xray 0, match:namespace hyprnotch

# SWAYNC BLUR & XRAY
# note: the "ignorezero" field is gone as of Hyprland 0.56
layerrule = blur true, match:namespace swaync-control-center
layerrule = blur true, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = xray 0, match:namespace swaync-control-center
layerrule = xray 0, match:namespace swaync-notification-window

#FLOAT
windowrule = float true, match:tag settings*
windowrule = float true, match:tag viewer*
windowrule = float true, match:tag multimedia_video*
windowrule = size 900 506, match:tag multimedia_video*
windowrule = float true, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = size 50% 60%, match:class ^(org.pulseaudio.pavucontrol)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus true, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# POP UPS AND DIALOGUES
windowrule = float true, match:title ^(Save As|Save a File|Pick Files)$
windowrule = size 50% 60%, match:title ^(Save As|Save a File|Pick Files)$
windowrule = center true, match:title ^(Save As|Save a File|Pick Files)$

windowrule = float true, match:initial_title (Open Files)
windowrule = size 70% 60%, match:initial_title (Open Files)

# Appearance settings panel
windowrule = float true, match:class dev.local.HyprSettings
windowrule = size 580 720, match:class dev.local.HyprSettings
windowrule = center true, match:class dev.local.HyprSettings
windowrule = float true, match:class dev.local.HyprKeys
windowrule = size 680 780, match:class dev.local.HyprKeys
windowrule = center true, match:class dev.local.HyprKeys


# Docker popup: anchored top right, under the bar
windowrule = float true, match:class dev.local.HyprWhale
windowrule = move 1178 66, match:class dev.local.HyprWhale  # centre sous la baleine
